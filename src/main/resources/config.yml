# General Configuration for GensCore
lang: "en_US"
# Administrative Web Panel Configuration
web:
  # Enable or disable the web panel
  enabled: true
  # Port on which the panel will be accessible (e.g., http://server-ip:8080)
  port: 8080
  # Force a specific language for the web panel (e.g. "fr_FR" or "en_US"). Leave empty to detect user's browser language.
  force_lang: ""

# MOTD
motd:
  line1: '&#00aaff&lA Minecraft Server'
  line2: '&7&l>> &ePowered by GensCore'

# Password to access the Admin Web Panel
admin-password: "gens"

# Database Configuration (SQLite)
database:
  file: "genscore.db"

# Chat Configuration
chat:
  # Enable or disable custom join/quit/first_join messages
  custom-join-messages: true

# Discord Configuration (JDA Module)
discord:
  # Discord Bot Token (VOTRE_TOKEN_ICI to disable the bot)
  bot_token: "VOTRE_TOKEN_ICI"

# BlueMap Configuration
bluemap:
  # Enable or disable the BlueMap module
  enabled: true
  # The URL where your BlueMap is hosted (used by the web panel)
  url: "http://localhost:8100"

# Daily Quests Parameters
quests:
  # Enable or disable the quests module
  enabled: true
  # Maximum number of quest rerolls per player per day
  max_rerolls_per_day: 3

modules:
  tomb:
    # Enable or disable the tombs module
    enabled: false
    # Type of block used for the tomb (e.g., CHEST, BARREL, PLAYER_HEAD)
    block_type: CHEST
    # Save the player's experience (XP) in the tomb?
    store_xp: true
    # Percentage of XP to save in the tomb (100 = all, 50 = half, etc.)
    xp_keep_percentage: 100
    # Tomb expiration time in seconds (e.g., 3600 = 1 hour, 0 = no expiration)
    expiration_time_seconds: 3600
    # Action to perform upon expiration (UNLOCK, DROP, DESTROY)
    # UNLOCK: Everyone can open it
    # DROP: Drops items on the ground
    # DESTROY: Deletes the tomb and items
    expiration_action: UNLOCK
    # Default access before expiration (OWNER_ONLY or EVERYONE)
    default_access: OWNER_ONLY

  home:
    # Default number of homes for a player
    default_max: 3
# Cooldown (in seconds) before a teleportation
teleport-cooldown: 3
