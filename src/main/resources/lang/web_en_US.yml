    docs:
      back_btn: Back to Home
      sections:
        bluemap:
          desc: Visualize the world in 3D from your browser thanks to BlueMap. Panel
            integration even allows administrators to track players in real time if
            needed.
          title: BlueMap Integration
        discord:
          desc: The Discord server and the game are fully linked. You can link your
            account via <code>/discord link</code>. Chat is synced both ways and even
            displays your ranks and guild!
          title: Discord-Minecraft Bridge
        economy:
          desc: The economy reacts to player actions. Shop prices (<code>/shop</code>)
            automatically adjust according to supply and demand. You can also sell
            items to other players via the Auction House (<code>/ah</code>).
          title: Economy & Dynamic Shop
        guilds:
          desc: Create your own Guild (<code>/team</code>) and invite your friends.
            Together, participate in the weekly quest to earn exclusive rewards and
            climb to the top of the global leaderboard!
          title: Guilds & Weekly Quests
        jobs:
          desc: Progress in your jobs (<code>/jobs</code>) to become the best craftsman
            on the server. Plus, you have the ability to retrieve <strong>Spawners</strong>
            with a Silk Touch pickaxe and place them anywhere for your personal farms!
          title: Jobs & Spawners
        locks:
          desc: Secure your chests with the <code>/lock</code> command. You can create
            private locks, or use <code>/lock guild</code> to share access to a chest
            with all members of your guild.
          title: Chest Locks (Locks)
        loot:
          desc: Collect the heads of monsters you kill, and enjoy a custom instantiated
            chest (Loot) system for each player. First comers no longer steal all
            the loot!
          title: Monster Heads & Custom Loot
        management:
          desc: The server has a unique web panel system allowing the owner to manage
            players, the shop, the economy, and server settings <strong>in real time</strong>
            without needing to restart.
          title: Autonomous Management System
        quests:
          desc: Daily challenges (<code>/quests</code>) are generated for each player.
            Kill monsters, mine blocks, or craft items to earn money and job experience.
          title: Daily Quests
      subtitle: Discover all the exclusive features of the Gens server.
      title: Complete Documentation
