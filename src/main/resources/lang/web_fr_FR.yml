    docs:
      title: Documentation Complète
      subtitle: Découvrez toutes les fonctionnalités exclusives du serveur Gens.
      back_btn: Retour à l'accueil
      sections:
        management:
          title: Système de Gestion Autonome
          desc: Le serveur dispose d'un système de panel web unique permettant au
            propriétaire de gérer les joueurs, la boutique, l'économie, et les paramètres
            du serveur <strong>en temps réel</strong> sans avoir besoin de redémarrer.
        economy:
          title: Économie & Boutique Dynamique
          desc: L'économie réagit aux actions des joueurs. Les prix de la boutique
            (<code>/shop</code>) s'ajustent automatiquement selon l'offre et la demande.
            Vous pouvez aussi vendre vos objets entre joueurs via l'Hôtel des Ventes
            (<code>/ah</code>).
        quests:
          title: Quêtes Quotidiennes
          desc: Des défis quotidiens (<code>/quests</code>) sont générés pour chaque
            joueur. Tuez des monstres, minez des blocs ou craftez des objets pour
            gagner de l'argent et de l'expérience de métier.
        jobs:
          title: Métiers & Spawners
          desc: Progressez dans vos métiers (<code>/jobs</code>) pour devenir le meilleur
            artisan du serveur. De plus, vous avez la capacité de récupérer les <strong>Spawners</strong>
            avec une pioche Silk Touch et de les replacer n'importe où pour vos fermes
            personnelles !
        bluemap:
          title: Intégration BlueMap
          desc: Visualisez le monde en 3D depuis votre navigateur grâce à BlueMap.
            L'intégration au panel permet même aux administrateurs de traquer les
            joueurs en temps réel si besoin.
        loot:
          title: Têtes de Monstres & Loot Personnalisé
          desc: Collectionnez les têtes des monstres que vous tuez, et profitez d'un
            système de coffres personnalisés (Loot) instanciés pour chaque joueur.
            Les premiers arrivés ne volent plus tout le loot !
        guilds:
          title: Guildes & Quêtes Hebdomadaires
          desc: Créez votre propre Guilde (<code>/team</code>) et invitez vos amis.
            Ensemble, participez à la quête hebdomadaire pour gagner des récompenses
            exclusives et monter en haut du classement global !
        locks:
          title: Verrous de Coffres (Locks)
          desc: Sécurisez vos coffres avec la commande <code>/lock</code>. Vous pouvez
            créer des verrous privés, ou utiliser <code>/lock guild</code> pour partager
            l'accès à un coffre avec tous les membres de votre guilde.
        discord:
          title: Pont Discord-Minecraft
          desc: Le serveur Discord et le jeu sont entièrement reliés. Vous pouvez
            lier votre compte via <code>/discord link</code>. Le chat est synchronisé
            dans les deux sens et affiche même vos grades et votre guilde !


