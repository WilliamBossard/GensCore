# Minigames Configuration
minigames:
  # Fortune Wheel settings
  wheel:
    # Enable or disable the Wheel
    enabled: true
    # List of possible rewards from the Wheel (8 balanced slices)
    rewards:
      '1':
        name: "16x Pain"
        command: "give %player% bread 16"
        chance: 32
        color: "#eab308"
      '2':
        name: "150$"
        command: "eco give %player% 150"
        chance: 25
        color: "#10b981"
      '3':
        name: "8x Fer"
        command: "give %player% iron_ingot 8"
        chance: 20
        color: "#94a3b8"
      '4':
        name: "350$"
        command: "eco give %player% 350"
        chance: 12
        color: "#06b6d4"
      '5':
        name: "2x Diamants"
        command: "give %player% diamond 2"
        chance: 6
        color: "#3b82f6"
      '6':
        name: "1x Pomme Dorée"
        command: "give %player% golden_apple 1"
        chance: 3
        color: "#f59e0b"
      '7':
        name: "750$"
        command: "eco give %player% 750"
        chance: 1
        color: "#a855f7"
      '8':
        name: "1x Netherite"
        command: "give %player% netherite_ingot 1"
        chance: 1
        color: "#ef4444"

  # Casino/Slot Machine settings
  casino:
    # Enable or disable the Casino
    enabled: true
    # Balanced RTP ~84% (4% * 5 + 8% * 3 + 20% * 2 = 84% return to player)
    jackpot_chance: 4
    medium_win_chance: 8
    small_win_chance: 20

  # CoinFlip (Pile ou Face) settings
  coinflip:
    # Enable or disable CoinFlip
    enabled: true
    # Multiplier on win (e.g. 2 for double the bet)
    multiplier: 2
