name: Build and Release GensCore

on:
  workflow_dispatch: # Permet de lancer l'action manuellement depuis l'onglet Actions

jobs:
  build:
    name: Build Plugin
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests
        
      - name: Create GitHub Release (Draft)
        uses: softprops/action-gh-release@v1
        with:
          name: "GensCore v1.0 (Brouillon)"
          tag_name: "v1.0"
          draft: true
          files: target/GensCore-1.0-SNAPSHOT-shaded.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
